name: 每日复盘分析

on:
  schedule:
    # 每个交易日北京时间 15:30 = UTC 07:30（封盘后复盘分析）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      no_push:
        description: '禁用飞书推送（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  daily-review:
    if: ${{ vars.ENABLE_CLOUD_MONITOR != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stock name map
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          cd backend
          python scripts/generate_stock_name_map.py || echo "生成映射表失败，使用默认映射表"

      - name: Collect today's limit-up stocks
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          cd backend
          python scripts/collect_limit_up.py || echo "收集涨停股票数据失败"

      - name: Run daily review analysis
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          NO_PUSH: ${{ github.event.inputs.no_push || 'false' }}
        run: |
          cd backend
          python scripts/run_daily_review.py

      - name: Commit review results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/limit_up_*.json data/reviews/ data/review_report.txt 2>/dev/null || true
          git commit -m "每日复盘分析结果 $(date +'%Y-%m-%d')" || echo "无新数据需要提交"
          git push || echo "推送失败，可能无新数据"
