name: 尾盘选股推荐

on:
  schedule:
    # 北京时间 14:30 = UTC 06:30（主触发，尾盘选股当日买入次日卖出）
    - cron: '30 6 * * 1-5'
    # 北京时间 14:50 = UTC 06:50（补偿触发：GitHub 免费版 schedule 可能延迟甚至丢触发，
    # 主触发未成功时由本次兜底；脚本对定时触发做幂等，今日已成功则自动跳过）
    - cron: '50 6 * * 1-5'
  workflow_dispatch:
    inputs:
      no_push:
        description: '禁用飞书推送（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  late-day-screener:
    if: ${{ vars.ENABLE_CLOUD_MONITOR != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stock name map
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          cd backend
          python scripts/generate_stock_name_map.py || echo "生成映射表失败，使用默认映射表"

      - name: Run late day screener
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          STOCK_LIST: ${{ vars.STOCK_LIST }}
        run: |
          cd backend
          echo "=== 尾盘选股开始（触发方式: ${{ github.event_name }}）==="
          # 定时触发（主+补偿）做幂等：今日已成功则跳过，避免重复推送；手动触发可重跑覆盖
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --late-day --force
          else
            python main.py --late-day --force --skip-if-done
          fi
          echo "=== 尾盘选股完成 ==="

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ || true
          git commit -m "尾盘选股结果 $(date +'%Y-%m-%d %H:%M')" || echo "无新数据提交"
          git push || echo "推送失败，可能无新数据"
