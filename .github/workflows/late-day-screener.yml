name: 尾盘选股推荐

on:
  schedule:
    # GitHub 免费版 schedule 不保证准点，整点/半点高峰易延迟甚至丢触发。
    # 策略：全部错峰到非整点分钟 + 尾盘窗口多点补偿 + 收盘兜底；
    # 脚本对定时触发做幂等（--skip-if-done），当天首个成功的触发推送，其余自动跳过，不会重复。
    # 以下均为 UTC，北京时间 = UTC+8。
    - cron: '32 6 * * 1-5'   # 北京 14:32 主触发（尾盘买入窗口）
    - cron: '41 6 * * 1-5'   # 北京 14:41 补偿1
    - cron: '49 6 * * 1-5'   # 北京 14:49 补偿2
    - cron: '57 6 * * 1-5'   # 北京 14:57 补偿3（收盘前最后窗口）
    - cron: '12 7 * * 1-5'   # 北京 15:12 收盘兜底（确保当日一定有结果，用于复盘/次日参考）
  workflow_dispatch:
    inputs:
      no_push:
        description: '禁用飞书推送（true/false）'
        required: false
        default: 'false'
  # 外部准点 cron（如 cron-job.org）通过 GitHub API 即时触发，绕开 GitHub schedule 队列延迟。
  # 调用：POST /repos/hurongson/stock-analyzer/dispatches  {"event_type":"late-day-screener"}
  # 走幂等+节假日跳过，与 schedule 兜底互不重复推送。
  repository_dispatch:
    types: [late-day-screener]

permissions:
  contents: write

jobs:
  late-day-screener:
    if: ${{ vars.ENABLE_CLOUD_MONITOR != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate stock name map
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          cd backend
          python scripts/generate_stock_name_map.py || echo "生成映射表失败，使用默认映射表"

      - name: Run late day screener
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          STOCK_LIST: ${{ vars.STOCK_LIST }}
        run: |
          cd backend
          echo "=== 尾盘选股开始（触发方式: ${{ github.event_name }}）==="
          # 定时触发（主+补偿+兜底）：不带 --force，节假日由 is_trading_day() 自动跳过；
          # --skip-if-done 做幂等，当天首个成功的触发推送，其余自动跳过；手动触发带 --force 可重跑覆盖。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py --late-day --force
          else
            python main.py --late-day --skip-if-done
          fi
          echo "=== 尾盘选股完成 ==="

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ || true
          git commit -m "尾盘选股结果 $(date +'%Y-%m-%d %H:%M')" || echo "无新数据提交"
          git push || echo "推送失败，可能无新数据"
